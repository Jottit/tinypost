# fly.toml — https://fly.io/docs/reference/configuration/

app = "tinypost"
primary_region = "ams"

[deploy]
  release_command = "alembic upgrade head"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[processes]
  app = "gunicorn app:app -w 2 --threads 2 --bind 0.0.0.0:8080"
  cron = "sh -c 'while true; do flask refresh-feeds; sleep 3600; done'"
